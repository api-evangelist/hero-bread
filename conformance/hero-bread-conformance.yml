domain_standards:
- id: ucp
  name: Universal Commerce Protocol
  market: agent-driven retail commerce
  conforms: true
  version: '2026-04-08'
  supported_versions: ['2026-04-08', '2026-01-23']
  evidence: >-
    https://shop.hero.co/.well-known/ucp (HTTP 200) declares services["dev.ucp.shopping"] with
    transport mcp and endpoint /api/ucp/mcp, and capabilities dev.ucp.shopping.cart,
    .checkout, .fulfillment, .discount, .order, .catalog.search, .catalog.lookup — each pinned to a
    ucp.dev schema URI. The tool names observed on the wire (create_cart, create_checkout,
    complete_checkout, search_catalog, lookup_catalog, get_order) are the UCP shopping-service
    vocabulary, not bespoke names.
  artifact: well-known/hero-bread-ucp.json
  significance: >-
    An agent that already speaks UCP transacts with this store with no bespoke connector. That is
    the whole point of the domain-standard signature, and it is declared in the contract rather than
    asserted in prose.
- id: dev.shopify.catalog
  name: Shopify Catalog UCP extension
  market: agent-driven retail commerce
  conforms: true
