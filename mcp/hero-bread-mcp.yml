tools:
- name: search_catalog
  category: catalog
  server: hero-bread-ucp
  description: Search Hero Bread products by natural-language query and/or filter criteria; paginated by cursor.
- name: lookup_catalog
  category: catalog
  server: hero-bread-ucp
  description: Resolve multiple product or variant identifiers (gid://shopify/Product/...) in one request.
- name: get_product
  category: catalog
  server: hero-bread-ucp
  description: Retrieve a single product with variants, exact pricing and real-time availability.
- name: create_cart
  category: cart
  server: hero-bread-ucp
  description: Create a new cart.
- name: get_cart
  category: cart
  server: hero-bread-ucp
  description: Read cart contents.
- name: update_cart
  category: cart
  server: hero-bread-ucp
  description: Apply updates to a cart.
- name: cancel_cart
  category: cart
  server: hero-bread-ucp
  description: Cancel a cart.
- name: create_checkout
  category: checkout
  server: hero-bread-ucp
  description: Create a checkout; returns line items, totals, discounts and taxes.
- name: get_checkout
  category: checkout
  server: hero-bread-ucp
  description: Read a checkout.
- name: update_checkout
  category: checkout
  server: hero-bread-ucp
  description: Update a checkout (shipping address, delivery method, payment instruments).
- name: complete_checkout
  category: checkout
  server: hero-bread-ucp
  description: Complete a checkout and return the order ID / thank-you-page URL. Requires meta.idempotency-key.
  requires_idempotency_key: true
- name: cancel_checkout
  category: checkout
  server: hero-bread-ucp
  description: Cancel a checkout.
- name: get_order
  category: order
  server: hero-bread-ucp
  description: Read the details of an order.
