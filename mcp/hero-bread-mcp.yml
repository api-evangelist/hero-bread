discovery_source: https://shop.hero.co/llms.txt
ownership_note: >-
  The MCP endpoint is served from shop.hero.co, Hero Bread's own storefront subdomain, and its UCP
  merchant profile identifies this merchant specifically (merchant_name "Hero", merchant_origin
  shop.hero.co, Shopify shop_id 56010965185). The protocol implementation is Shopify's platform
  capability rather than software Hero Bread authored, but it is exposed on the company's own host
  and transacts against the company's own catalog, cart, checkout and orders — the templated /
  platform-hosted case described in the pipeline ownership rule.
