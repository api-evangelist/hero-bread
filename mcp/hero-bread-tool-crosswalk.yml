note: >-
  Hero Bread publishes no OpenAPI, so this crosswalk cannot bind tools to operationIds. What it can
  bind — and what matters for an agent — is each tool to the UCP capability that defines its
  contract, and to the two other surfaces the same commerce core projects through: the legacy
  Shopify Storefront MCP endpoint and the public storefront JSON/HTML paths the store's llms.txt
  documents. The divergences below are real and were all observed on the wire.
surfaces:
  openapi: null
  graphql: null
  ucp_mcp:
    url: https://shop.hero.co/api/ucp/mcp
    tools_list: 200 (anonymous)
    tools_call: gated (requires meta.ucp-agent.profile + Shopify agent JWT)
  storefront_mcp:
    url: https://shop.hero.co/api/mcp
    tools_list: 200 (anonymous)
    tools: 5
  storefront_http:
    documented_at: https://shop.hero.co/llms.txt
    paths:
    - GET /products/{handle}.json
    - GET /collections/{handle}/products.json
    - GET /collections/all
    - GET /search?q={query}&type=product
    - GET /sitemap.xml
    note: >-
      robots.txt explicitly steers agents away from the AJAX surfaces (/cart.js,
      /recommendations/products) and toward UCP/MCP for cart and checkout.
