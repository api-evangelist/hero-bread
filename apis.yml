aid: hero-bread
name: Hero Bread
description: >-
  Hero Bread is an American food-technology company that makes low-net-carb, high-fiber, zero-sugar
  baked goods — sliced breads, tortillas, buns, rolls and bagels — sold direct-to-consumer from
  hero.co and through grocery and foodservice retail. It is not a developer-tools company and
  publishes no developer portal, OpenAPI description or API documentation. It does, however, operate
  a live agent-commerce surface on its own storefront subdomain: shop.hero.co serves an llms.txt and
  an agents.md, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and an
  unauthenticated MCP endpoint at /api/ucp/mcp exposing thirteen catalog, cart, checkout and order
  tools — a Shopify platform capability exposed on the merchant's own host against the merchant's
  own catalog.
