apis:
- aid: hero-bread:hero-bread-ucp-mcp
  name: Hero Bread Storefront Agent Commerce (UCP/MCP)
  description: >-
    The agent-facing commerce interface for the Hero Bread online store. An MCP server at
    https://shop.hero.co/api/ucp/mcp implements the Universal Commerce Protocol shopping service
    (dev.ucp.shopping) with thirteen tools spanning catalog search and lookup, cart create/read/
    update/cancel, checkout create/read/update/complete/cancel, and order read. tools/list answers
    anonymously; tools/call requires a resolvable UCP agent profile and, for transactional tools, a
    Shopify agent JWT. complete_checkout requires an idempotency key and, per the store's own
    published rules, explicit contemporaneous buyer approval before payment.
  humanURL: https://shop.hero.co/agents.md
  baseURL: https://shop.hero.co/api/ucp/mcp
